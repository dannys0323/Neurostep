<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paciente - NeuroSTEP IA</title>
<style>
  :root{
    --bg:#0a1114; --panel:#0e181c; --card:#101c21; --line:#17323a;
    --cyan:#22d3e6; --cyan-soft:rgba(34,211,230,.15);
    --text:#e6f1f3; --muted:#7f98a0;
    --green:#3fae49; --red:#e04848; --orange:#f0a020;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  .topbar{
    display:flex;align-items:center;gap:16px;padding:0 24px;height:64px;
    background:var(--panel);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10;
  }
  .brand{font-size:20px}.brand b{color:var(--cyan);font-weight:600}.brand span{color:var(--muted)}
  .spacer{flex:1}
  .user{display:flex;align-items:center;gap:10px;font-size:14px}
  .user small{display:block;color:var(--muted);font-size:11px}
  .avatar{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,#2a4a55,#173039);border:1px solid var(--line);
    display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--cyan);
  }
  .logout{
    background:none;border:1px solid var(--line);color:var(--muted);
    padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;
  }
  .logout:hover{border-color:var(--cyan);color:var(--cyan)}

  .wrap{max-width:1200px;margin:0 auto;padding:24px}
  .back{display:inline-block;color:var(--cyan);text-decoration:none;font-size:14px;margin-bottom:16px}
  .back:hover{text-decoration:underline}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
  .card h3{
    font-size:13px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;
    color:var(--cyan);margin-bottom:14px;
  }

  /* Header del paciente */
  .hero{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    border:2px solid rgba(34,211,230,.4);
    box-shadow:0 0 22px rgba(34,211,230,.15);
    margin-bottom:18px;
  }
  .hero .avatar{width:76px;height:76px;font-size:26px}
  .hero h1{font-size:26px;font-weight:500}
  .hero .meta{color:var(--muted);font-size:13px;margin-top:4px}
  .hero .right{margin-left:auto;display:flex;gap:28px;text-align:center}
  .hero .right small{display:block;color:var(--muted);font-size:11px;letter-spacing:.5px;margin-bottom:6px}
  .badge{
    display:inline-block;min-width:56px;padding:6px 12px;border-radius:6px;
    font-weight:700;font-size:18px;color:#fff;
  }
  .b-green{background:var(--green)}.b-red{background:var(--red)}.b-orange{background:var(--orange);color:#1a1200}
  .pill{
    display:inline-block;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;
    border:1px solid currentColor;
  }
  .pill.ok{color:var(--green)}.pill.warn{color:var(--orange)}.pill.bad{color:var(--red)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .full{grid-column:1 / -1}

  dl{display:grid;grid-template-columns:140px 1fr;row-gap:10px;font-size:14px}
  dt{color:var(--muted)}
  dd{color:var(--text)}

  /* Mapa de presión */
  .pressure-map{padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .feet{display:flex;justify-content:center;gap:clamp(20px,8vw,100px);flex-wrap:wrap}
  .feet figure{
    min-width:200px;padding:16px 20px 12px;text-align:center;
    border:1px solid var(--line);border-radius:10px;background:var(--card)
  }
  .feet svg{display:block;width:190px;height:300px;max-width:100%;margin:0 auto}
  .feet figcaption{font-size:13px;color:var(--text);font-weight:600;margin-top:8px}
  .pressure-legend{max-width:480px;margin:22px auto 0}
  .pressure-legend p{font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px}
  .scale{
    height:14px;border-radius:8px;border:1px solid rgba(230,241,243,.16);
    background:linear-gradient(90deg,#278846 0%,#a6bb32 25%,#e6c42c 50%,#ed7a27 75%,#d83b3b 100%);
  }
  .scale-l{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted)}
  .zones{margin-top:18px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .zone-value{
    padding:9px 6px;border:1px solid var(--line);border-radius:7px;
    background:var(--card);text-align:center;font-size:12px;color:var(--muted)
  }
  .zone-value strong{display:block;color:var(--text);font-size:14px;margin-top:3px}

  /* Tablas e historial */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px}
  td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
  .image-table-wrap{overflow-x:auto}
  .image-table{min-width:520px}
  .image-thumb{
    display:block;width:112px;height:84px;object-fit:cover;
    border:1px solid var(--line);border-radius:7px;background:var(--panel);
  }
  .image-unavailable{color:var(--muted);font-size:12px}
  .chart{width:100%;height:150px;display:block}
  .note{
    background:var(--panel);border-left:3px solid var(--cyan);
    padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.5;
    white-space:pre-wrap;
  }
  .observation-form{display:grid;gap:10px}
  .observation-form label{font-size:13px;color:var(--muted)}
  .observation-form textarea{
    width:100%;min-height:110px;resize:vertical;padding:11px 12px;
    border:1px solid var(--line);border-radius:7px;background:var(--panel);
    color:var(--text);font:inherit;line-height:1.5;
  }
  .observation-form textarea:focus{outline:2px solid var(--cyan);outline-offset:1px}
  .observation-list{display:grid;gap:10px;margin-top:16px}
  .observation-item{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  .observation-meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px;color:var(--muted);font-size:12px}
  .observation-text{font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
  .form-message{min-height:18px;color:var(--muted);font-size:12px}
  .form-message.error{color:#ff9a9a}
  .form-message.success{color:var(--green)}
  .note-label{color:var(--muted);font-size:12px;margin-bottom:7px}
  .review-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .review-field{display:grid;gap:6px}
  .review-field label{color:var(--muted);font-size:12px}
  .review-field input,.review-field select,.review-field textarea{
    width:100%;min-width:0;padding:10px 11px;border:1px solid var(--line);
    border-radius:6px;background:var(--panel);color:var(--text);font:inherit;font-size:13px;
  }
  .review-field textarea{min-height:76px;resize:vertical}
  .review-field input:focus,.review-field select:focus,.review-field textarea:focus{outline:2px solid var(--cyan);outline-offset:1px}
  .review-field.full{grid-column:1/-1}
  .review-actions{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .btn{
    padding:10px 16px;border-radius:8px;border:1px solid var(--cyan);
    background:transparent;color:var(--cyan);cursor:pointer;font-size:14px;
  }
  .btn:hover{background:var(--cyan-soft)}
  .btn.primary{background:var(--cyan);color:#04181c;font-weight:600}
  .empty{text-align:center;padding:80px 20px;color:var(--muted)}

  @media (max-width:800px){
    .grid{grid-template-columns:1fr}
    .hero .right{margin-left:0}
    .review-form{grid-template-columns:1fr 1fr}
  }
  @media (max-width:560px){
    .wrap{padding:14px}
    .pressure-map{padding:10px}
    .feet{gap:12px}
    .feet figure{min-width:0;width:100%;max-width:250px;padding:12px}
    .zones{grid-template-columns:repeat(2,minmax(0,1fr))}
    .zone-value:last-child{grid-column:1 / -1}
    .review-form{grid-template-columns:1fr}
    .review-field.full,.review-actions{grid-column:auto}
  }
  @media print{
    .topbar,.back,.edit-only,.observation-form,.record-actions,.form-message{display:none!important}
    body{background:#fff;color:#000}
    .wrap{max-width:none;padding:0}
    .card{break-inside:avoid;background:#fff;color:#000;border:1px solid #888;box-shadow:none}
    .hero{border:1px solid #555}
    .hero .meta,dt,.note-label,.observation-meta,.pressure-legend p,.scale-l{color:#333}
    dd,.observation-text,.note,td,.zone-value strong{color:#000}
    .grid{gap:10px}
    .pressure-map,.feet figure,.zone-value{background:#fff;color:#000;border-color:#aaa}
    .pressure-map .feet svg path{fill:#f5f5f5;stroke:#333}
    .pressure-map .feet svg .pressure-value{fill:#000;stroke:#fff}
    .badge,.pill{print-color-adjust:exact;-webkit-print-color-adjust:exact}
    table{break-inside:auto}
    tr{break-inside:avoid}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">👣 <b>NeuroStep IA</b> <span>- Medical Portal</span></div>
  <div class="spacer"></div>
  <div class="user">
    <div class="avatar" id="docAvatar">--</div>
    <div><span id="docName">Doctor</span><small id="docRole"></small></div>
  </div>
  <button class="logout" id="logout">Salir</button>
</header>

<main class="wrap" id="app"></main>

<script src="supabase-connection.js"></script>
<script src="data.js"></script>
<script>
(async () => {
/* ---------- 1. Protección de sesión ---------- */
let doc;
try {
  doc = await window.supabaseApp.requireDoctor();
  if (!doc) return;
  await loadPatientsFromSupabase();
} catch (error) {
  console.error("No se pudo cargar la ficha del paciente:", error);
  document.getElementById("app").textContent =
    "No se pudieron cargar los datos desde Supabase. Verifica la conexión y la configuración.";
  return;
}
if(doc.name){
  document.getElementById("docName").textContent = doc.name;
  document.getElementById("docRole").textContent = doc.role || "";
  document.getElementById("docAvatar").textContent =
    doc.name.split(" ").map(n => n[0]).join("").slice(0,2).toUpperCase();
}
document.getElementById("logout").onclick = async () => {
  try {
    await window.supabaseApp.signOut();
  } catch (error) {
    console.error("No se pudo cerrar la sesión:", error);
    alert("No se pudo cerrar la sesión. Inténtalo de nuevo.");
  }
};

/* ---------- 2. Buscar paciente por ?id= ---------- */
const id = new URLSearchParams(location.search).get("id");
const p = PATIENTS.find(x => x.id === id);
const app = document.getElementById("app");

/* ---------- 3. Utilidades ---------- */
const initialsOf = n => n.split(" ").map(x => x[0]).join("").slice(0,2).toUpperCase();
let pressureMapId = 0;

function footSVG(zones, mirror){
  const definitions = [
    { key:"toes", label:"Dedos", x:80, y:72, rx:35, ry:25 },
    { key:"medial", label:"Metatarso interno", x:62, y:119, rx:29, ry:30 },
    { key:"lateral", label:"Metatarso externo", x:103, y:119, rx:29, ry:30 },
    { key:"mid", label:"Mediopié", x:82, y:184, rx:27, ry:31 },
    { key:"heel", label:"Talón", x:82, y:252, rx:34, ry:31 }
  ];
  const gid = `pressure-${++pressureMapId}`;
  const colorFor = value => {
    const bounded = Math.max(0, Math.min(100, Number(value) || 0));
    return `hsl(${120 - bounded * 1.2}, 78%, 47%)`;
  };
  const gradients = definitions.map(({key}) => `
    <radialGradient id="${gid}-${key}">
      <stop offset="0%" stop-color="${colorFor(zones?.[key])}" stop-opacity=".96"/>
      <stop offset="68%" stop-color="${colorFor(zones?.[key])}" stop-opacity=".82"/>
      <stop offset="100%" stop-color="${colorFor(zones?.[key])}" stop-opacity=".18"/>
    </radialGradient>`).join("");
  const hotspots = definitions.map(({key,label,x,y,rx,ry}) => {
    const value = Math.max(0, Math.min(100, Number(zones?.[key]) || 0));
    return `
      <ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#${gid}-${key})"/>
      <ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1"/>
      <title>${label}: ${value} de 100</title>`;
  }).join("");
  const values = definitions.map(({key,x,y}) => {
    const value = Math.max(0, Math.min(100, Number(zones?.[key]) || 0));
    return `<text x="${mirror ? 165 - x : x}" y="${y + 4}" text-anchor="middle" class="pressure-value">${value}</text>`;
  }).join("");
  const shape = "M82 22 C112 22 132 44 137 76 C142 108 133 139 120 165 C111 183 111 204 117 226 C124 249 137 265 132 280 C127 295 106 300 82 300 C58 300 37 295 32 280 C27 265 40 249 47 226 C53 204 53 183 44 165 C31 139 22 108 27 76 C32 44 52 22 82 22 Z";
  return `
  <svg viewBox="0 0 165 300" role="img" aria-label="Mapa de presión plantar, escala de 0 a 100">
    <defs>
      <clipPath id="${gid}-foot"><path d="${shape}"/></clipPath>
      ${gradients}
    </defs>
    <g${mirror ? ' transform="translate(165 0) scale(-1 1)"' : ""}>
      <path d="${shape}" fill="#14262b" stroke="#8aa2a8" stroke-width="2.5" stroke-linejoin="round"/>
      <g clip-path="url(#${gid}-foot)">${hotspots}</g>
      <path d="${shape}" fill="none" stroke="#d7e5e8" stroke-opacity=".85" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    ${values}
    <style>.pressure-value{fill:#fff;font:700 12px 'Segoe UI',Arial,sans-serif;paint-order:stroke;stroke:#152126;stroke-width:3px;stroke-linejoin:round}</style>
  </svg>`;
}

function historyChart(h){
  if(h.length < 2) return `<p style="color:var(--muted);font-size:13px">Se necesitan al menos 2 registros para mostrar la tendencia.</p>`;
  const W = 400, H = 110, max = Math.max(1, ...h.map(x => Number(x.risk) || 0)) * 1.2;
  const step = W / (h.length - 1);
  const pts = h.map((x,i) => [i*step, H - (x.risk/max)*H]);
  const d = pts.map((q,i) => `${i?"L":"M"}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(" ");
  const dots = pts.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#22d3e6"/>`).join("");
  return `<svg class="chart" viewBox="-6 -6 ${W+12} ${H+12}" preserveAspectRatio="none">
    <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3e6" stop-opacity=".4"/><stop offset="1" stop-color="#22d3e6" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${d} L${W},${H} L0,${H} Z" fill="url(#hg)"/>
    <path d="${d}" fill="none" stroke="#22d3e6" stroke-width="2" vector-effect="non-scaling-stroke"/>
    ${dots}
  </svg>`;
}

function safeImageSource(source){
  const value = String(source || "").trim();
  if (!value) return "";
  try {
    const url = new URL(value, location.href);
    return url.protocol === "http:" || url.protocol === "https:" ? value : "";
  } catch (error) {
    return "";
  }
}

/* ---------- 4. Render de la ficha ---------- */
function render(p){
  document.title = `${p.fullName} - NeuroStep IA`;
  const bmi = (p.weight / (p.height * p.height)).toFixed(1);
  const images = Array.isArray(p.images)
    ? p.images.filter(image => image && typeof image === "object")
    : [];

  app.innerHTML = `
  <a class="back" href="index.html">← Volver al dashboard</a>

  <section class="card hero">
    <div class="avatar">${initialsOf(p.fullName)}</div>
    <div>
      <h1>${p.fullName}</h1>
      <div class="meta">ID ${p.id.toUpperCase()} · ${p.age} años · ${p.sex}</div>
    </div>
    <div class="right">
      <div><small>ÍNDICE DE RIESGO</small><span class="badge b-${p.color}">${p.risk}</span></div>
      <div><small>NEUROPATÍA</small><span class="pill ${p.neuro}">${p.neuroLabel}</span></div>
      <div><small>ÚLTIMO ANÁLISIS</small><strong>${p.lastDate}</strong></div>
    </div>
  </section>

  <div class="grid">
    <section class="card">
      <h3>Datos personales</h3>
      <dl>
        <dt>Nombre completo</dt><dd>${p.fullName}</dd>
        <dt>Fecha de nacimiento</dt><dd>${p.dob}</dd>
        <dt>Edad</dt><dd>${p.age} años</dd>
        <dt>Sexo</dt><dd>${p.sex}</dd>
        <dt>Teléfono</dt><dd>${p.phone}</dd>
      </dl>
    </section>

    <section class="card">
      <h3>Datos clínicos</h3>
      <dl>
        <dt>Diabetes</dt><dd>${p.diabetes}</dd>
        <dt>Peso</dt><dd>${p.weight} kg</dd>
        <dt>Estatura</dt><dd>${p.height} m</dd>
        <dt>IMC</dt><dd>${bmi}</dd>
        <dt>Monofilamento</dt><dd>${p.tests.monofilamento}</dd>
        <dt>Vibración</dt><dd>${p.tests.vibracion}</dd>
        <dt>Reflejos</dt><dd>${p.tests.reflejos}</dd>
      </dl>
    </section>

    <section class="card full">
      <h3>Mapa de presión plantar</h3>
      <div class="pressure-map">
        <div class="feet">
          <figure>${footSVG(p.pressure.L, false)}<figcaption>Pie izquierdo</figcaption></figure>
          <figure>${footSVG(p.pressure.R, true)}<figcaption>Pie derecho</figcaption></figure>
        </div>
        <div class="pressure-legend">
          <p>Presión relativa por zona (0–100)</p>
          <div class="scale"></div>
          <div class="scale-l"><span>Baja</span><span>25</span><span>50</span><span>75</span><span>Alta</span></div>
        </div>
        <div class="zones" aria-label="Valores por zona de presión">
          <div class="zone-value">Dedos<strong>I ${p.pressure.L.toes} · D ${p.pressure.R.toes}</strong></div>
          <div class="zone-value">Metatarso interno<strong>I ${p.pressure.L.medial} · D ${p.pressure.R.medial}</strong></div>
          <div class="zone-value">Metatarso externo<strong>I ${p.pressure.L.lateral} · D ${p.pressure.R.lateral}</strong></div>
          <div class="zone-value">Mediopié<strong>I ${p.pressure.L.mid} · D ${p.pressure.R.mid}</strong></div>
          <div class="zone-value">Talón<strong>I ${p.pressure.L.heel} · D ${p.pressure.R.heel}</strong></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h3>Evolución del índice de riesgo</h3>
      ${historyChart(p.history)}
    </section>

    <section class="card full">
      <h3>Imágenes enviadas por el paciente</h3>
      <div class="image-table-wrap">
        <table class="image-table">
          <thead><tr><th>Fecha</th><th>Imagen</th><th>Observación</th></tr></thead>
          <tbody>
            ${images.length ? images.map(image => {
              const source = safeImageSource(image.url);
              return `<tr>
                <td>${esc(image.date || "Fecha no disponible")}</td>
                <td>${source
                  ? `<a href="${esc(source)}" target="_blank" rel="noopener noreferrer"><img class="image-thumb" src="${esc(source)}" alt="Imagen enviada por ${esc(p.fullName)}" loading="lazy"></a>`
                  : `<span class="image-unavailable">Imagen no disponible</span>`}</td>
                <td>${esc(image.note || "")}</td>
              </tr>`;
            }).join("") : `<tr><td colspan="3" class="image-unavailable">Todavía no hay imágenes enviadas por este paciente.</td></tr>`}
          </tbody>
        </table>
      </div>
    </section>

    <section class="card full edit-only">
      <h3>Agregar revisión clínica</h3>
      <form class="review-form" id="reviewForm">
        <div class="review-field">
          <label for="reviewDate">Fecha de revisión *</label>
          <input id="reviewDate" type="date" required>
        </div>
        <div class="review-field">
          <label for="reviewRisk">Índice de riesgo (0–10) *</label>
          <input id="reviewRisk" type="number" min="0" max="10" step="1" value="${p.risk}" required>
        </div>
        <div class="review-field">
          <label for="reviewNeuro">Neuropatía *</label>
          <select id="reviewNeuro" required>
            <option value="none" ${p.neuro === "ok" ? "selected" : ""}>Sin neuropatía</option>
            <option value="mild" ${p.neuro === "warn" && p.neuroLabel === "Neuropatía leve" ? "selected" : ""}>Leve</option>
            <option value="moderate" ${p.neuro === "warn" && p.neuroLabel !== "Neuropatía leve" ? "selected" : ""}>Moderada</option>
            <option value="severe" ${p.neuro === "bad" ? "selected" : ""}>Severa</option>
          </select>
        </div>
        <div class="review-field">
          <label for="reviewMonofilament">Monofilamento</label>
          <input id="reviewMonofilament" maxlength="120" value="${esc(p.tests.monofilamento)}">
        </div>
        <div class="review-field">
          <label for="reviewVibration">Vibración</label>
          <input id="reviewVibration" maxlength="120" value="${esc(p.tests.vibracion)}">
        </div>
        <div class="review-field">
          <label for="reviewReflexes">Reflejos</label>
          <input id="reviewReflexes" maxlength="120" value="${esc(p.tests.reflejos)}">
        </div>
        <div class="review-field full">
          <label for="reviewNote">Observaciones de esta revisión *</label>
          <textarea id="reviewNote" maxlength="2000" required placeholder="Hallazgos y observaciones clínicas..."></textarea>
        </div>
        <div class="review-actions">
          <button class="btn primary" type="submit">Guardar revisión</button>
          <span class="form-message" id="reviewMessage" role="status" aria-live="polite"></span>
        </div>
      </form>
    </section>

    <section class="card full">
      <h3>Anotaciones del doctor</h3>
      <form class="observation-form" id="observationForm">
        <label for="observationText">Agregar observación para este paciente</label>
        <textarea id="observationText" maxlength="2000" required placeholder="Escribe una nota de seguimiento, observación clínica o recomendación..."></textarea>
        <div class="actions" style="margin-top:0">
          <button class="btn primary" type="submit">Guardar observación</button>
          <span class="form-message" id="observationMessage" role="status" aria-live="polite"></span>
        </div>
      </form>
      <div class="observation-list" id="observationList">
        ${(Array.isArray(p.observations) ? [...p.observations].reverse() : []).map(observation => {
          const timestamp = Date.parse(observation.date);
          const dateLabel = Number.isFinite(timestamp)
            ? new Intl.DateTimeFormat("es-MX", {dateStyle:"medium", timeStyle:"short"}).format(new Date(timestamp))
            : "Fecha no disponible";
          return `<article class="observation-item">
            <div class="observation-meta"><strong>${esc(observation.author || "Doctor")}</strong><time>${dateLabel}</time></div>
            <p class="observation-text">${esc(observation.text || "")}</p>
          </article>`;
        }).join("")}
      </div>
      ${p.notes ? `<div style="margin-top:16px"><p class="note-label">Nota de seguimiento registrada</p><div class="note">${esc(p.notes)}</div></div>` : ""}
    </section>

    <section class="card full">
      <h3>Historial de registros</h3>
      <table>
        <thead><tr><th>Fecha</th><th>Riesgo</th><th>Observaciones</th></tr></thead>
        <tbody>
          ${[...p.history].reverse().map(h => `
            <tr><td>${h.date}</td><td><strong>${h.risk}</strong></td><td>${h.note}</td></tr>`).join("")}
        </tbody>
      </table>
    </section>
  </div>

  <div class="actions record-actions">
    <button class="btn primary" type="button" onclick="window.print()">Imprimir expediente / Guardar PDF</button>
    <a class="btn" href="barrapacientes.html" style="text-decoration:none">Volver a la lista</a>
  </div>`;
}

if(!p){
  app.innerHTML = `<div class="empty"><h2>Paciente no encontrado</h2><br>
    <a class="back" href="index.html">← Volver al dashboard</a></div>`;
} else {
  function bindReviewForm(){
    const reviewForm = document.getElementById("reviewForm");
    const dateInput = document.getElementById("reviewDate");
    if (!dateInput.value) {
      const today = new Date();
      today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
      dateInput.value = today.toISOString().slice(0, 10);
    }

    reviewForm.addEventListener("submit", async event => {
      event.preventDefault();
      const message = document.getElementById("reviewMessage");
      const risk = Number(document.getElementById("reviewRisk").value);
      const note = document.getElementById("reviewNote").value.trim();
      message.className = "form-message";

      if (!Number.isFinite(risk) || risk < 0 || risk > 10 || !note || !dateInput.value) {
        message.textContent = "Completa la fecha, un riesgo entre 0 y 10 y las observaciones.";
        message.classList.add("error");
        return;
      }

      try {
        const updated = await addRecord(id, {
          date: dateInput.value,
          risk,
          neuro: document.getElementById("reviewNeuro").value,
          note,
          tests: {
            monofilamento: document.getElementById("reviewMonofilament").value,
            vibracion: document.getElementById("reviewVibration").value,
            reflejos: document.getElementById("reviewReflexes").value
          }
        });
        if (!updated) {
          message.textContent = "No se pudo asociar la revisión con este paciente.";
          message.classList.add("error");
          return;
        }
        render(updated);
        bindReviewForm();
        bindObservationForm();
        const successMessage = document.getElementById("reviewMessage");
        successMessage.textContent = "Revisión guardada y ficha actualizada.";
        successMessage.classList.add("success");
      } catch (error) {
        console.error("No se pudo guardar la evaluación en Supabase:", error);
        message.textContent = "No se pudo guardar la revisión en Supabase. Verifica la conexión e inténtalo de nuevo.";
        message.classList.add("error");
      }
    });
  }

  function bindObservationForm(){
    const observationForm = document.getElementById("observationForm");
    observationForm.addEventListener("submit", async event => {
      event.preventDefault();
      const textarea = document.getElementById("observationText");
      const message = document.getElementById("observationMessage");
      const text = textarea.value.trim();
      message.className = "form-message";

      if (!text) {
        message.textContent = "Escribe una observación antes de guardarla.";
        message.classList.add("error");
        textarea.focus();
        return;
      }

      try {
        const observation = await addPatientObservation(id, text, doc.name);
        if (!observation) {
          message.textContent = "No se pudo asociar la observación con este paciente.";
          message.classList.add("error");
          return;
        }

        const timestamp = Date.parse(observation.date);
        const dateLabel = new Intl.DateTimeFormat("es-MX", {dateStyle:"medium", timeStyle:"short"}).format(new Date(timestamp));
        const article = document.createElement("article");
        article.className = "observation-item";
        article.innerHTML = `<div class="observation-meta"><strong>${esc(observation.author)}</strong><time>${dateLabel}</time></div>
          <p class="observation-text">${esc(observation.text)}</p>`;
        document.getElementById("observationList").prepend(article);
        textarea.value = "";
        message.textContent = "Observación guardada.";
        message.classList.add("success");
      } catch (error) {
        console.error("No se pudo guardar la observación en Supabase:", error);
        message.textContent = "No se pudo guardar la observación en Supabase. Verifica la conexión e inténtalo de nuevo.";
        message.classList.add("error");
      }
    });
  }

  render(p);
  bindReviewForm();
  bindObservationForm();
}
})();
</script>
</body>
</html>
